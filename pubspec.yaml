name: mywebsite
description: A new Flutter project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Webda xato bermasligi uchun core qo'shildi va versiyalar moslandi
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8

  # Carousel Slider - Flutter 3.x dagi Material Carousel bilan to'qnashmasligi uchun 5.0 ga o'tdik
  carousel_slider: ^5.0.0

  # Boshqa paketlar (Eng barqaror versiyalar)
  animated_text_kit: ^4.2.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  responsive_builder: ^0.7.1
  scrollable_positioned_list: ^0.3.8
  universal_html: ^2.2.4
  url_launcher: ^6.2.5
  webview_flutter: ^4.5.0
  flutter_image_slideshow: ^0.1.6
  easy_localization: ^3.0.7
  http: ^1.2.0
  mailer: ^6.1.0
  fluttertoast: ^8.2.4
  flutter_smart_dialog: ^4.9.5
  mask_text_input_formatter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/services/
    - assets/projects/
    - assets/translations/

  fonts:
    - family: Agustina
      fonts:
        - asset: assets/fonts/agustina.otf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat.ttf